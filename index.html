
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Bingo Online 75</title>
<style>
:root{font-family:Arial,sans-serif;color:#fff;background:#10203e}
*{box-sizing:border-box}
body{margin:0;padding:24px 12px;text-align:center}
h1{color:#ffda00;font-size:clamp(25px,5vw,38px)}
.panel{max-width:480px;background:#20375c;border-radius:16px;padding:18px 15px;margin:16px auto}
input,select{font-size:16px;padding:13px;border:0;border-radius:8px;max-width:100%}
button{background:#ffd600;color:#151515;border:0;border-radius:8px;padding:13px 16px;cursor:pointer;font-size:15px}
button:hover{background:#ffe65c}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:16px}
.cell{display:grid;place-items:center;min-height:49px;border-radius:5px;background:white;color:#10203e;font-weight:bold}
.head{background:#1b69ca;color:white}
.marked{background:#20c184;color:#fff}
.last{font-size:28px;color:#ffd600;font-weight:bold;min-height:35px}
.small{font-size:13px;color:#cbd7e9}
.status{font-weight:bold;min-height:25px}
.history{line-height:1.7;overflow-wrap:anywhere}
.warning{color:#ffe08b}
#cardWrap[hidden]{display:none}
</style>
</head>
<body>
<h1>🎱 MI BINGO ONLINE 75</h1>

<section class="panel">
<h2>Jugador</h2>
<div class="controls">
<input id="playerName" placeholder="Tu nombre" maxlength="40">
<button id="getCard">Recibir mi cartón</button>
</div>
<div id="cardWrap" hidden>
<p id="cardName"></p>
<div class="grid" id="card"></div>
<p class="status" id="winStatus" aria-live="polite"></p>
</div>
</section>

<section class="panel">
<h2>🎤 Panel del anfitrión</h2>
<label for="pattern">Forma de ganar</label>
<p>
<select id="pattern">
<option value="small">Cuadro pequeño</option>
<option value="large">Cuadro grande</option>
<option value="crossSmall">Cruz pequeña</option>
<option value="crossLarge">Cruz grande</option>
<option value="corners">Cuatro esquinas</option>
<option value="machete">Macheteado (cartón lleno)</option>
<option value="line">Línea horizontal o vertical</option>
</select>
</p>
<button id="draw">Sacar bola</button>
<p class="last" id="last">--</p>
<button id="reset">Nueva partida</button>
<p class="small">Bolas extraídas: <span id="count">0</span> / 75</p>
<div class="history" id="history"></div>
<p class="small warning">Versión de prueba: cada dispositivo funciona por separado. El panel aún no es privado.</p>
</section>

<script>
'use strict';
const $=id=>document.getElementById(id);
const ranges=[[1,15],[16,30],[31,45],[46,60],[61,75]];
let board=null,player='',drawn=[],pool=Array.from({length:75},(_,i)=>i+1),announced=false;
const index=(r,c)=>r*5+c;

function pickUnique(min,max,count){
 const nums=Array.from({length:max-min+1},(_,i)=>min+i);
 for(let i=nums.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [nums[i],nums[j]]=[nums[j],nums[i]];
 }
 return nums.slice(0,count).sort((a,b)=>a-b);
}

function newBoard(){
 const cols=ranges.map(([a,b],c)=>pickUnique(a,b,c===2?4:5));
 const result=Array(25).fill(null);
 for(let c=0;c<5;c++){
  let k=0;
  for(let r=0;r<5;r++){
   if(r===2&&c===2)continue;
   result[index(r,c)]=cols[c][k++];
  }
 }
 return result;
}

function renderBoard(){
 if(!board)return;
 const marked=new Set(drawn);
 $('card').innerHTML='';
 for(const letter of 'BINGO'){
  const h=document.createElement('div');
  h.className='cell head';
  h.textContent=letter;
  $('card').appendChild(h);
 }
 board.forEach((num,i)=>{
  const el=document.createElement('div');
  el.className='cell'+(num===null||marked.has(num)?' marked':'');
  el.textContent=num===null?'⭐':String(num);
  $('card').appendChild(el);
 });
 checkWinner();
}

function patterns(type){
 const groups=[];
 const square=(r,c,n)=>{
  let a=[];
  for(let y=r;y<r+n;y++)
   for(let x=c;x<c+n;x++)a.push(index(y,x));
  return a;
 };
 if(type==='small'){
  for(let r=0;r<=3;r++)
   for(let c=0;c<=3;c++)groups.push(square(r,c,2));
 }
 if(type==='large')groups.push(square(0,0,5));
 if(type==='crossSmall'){
  groups.push([index(2,2),index(1,2),index(3,2),index(2,1),index(2,3)]);
 }
 if(type==='crossLarge'){
  groups.push([
   ...Array.from({length:5},(_,r)=>index(r,2)),
   ...Array.from({length:5},(_,c)=>index(2,c))
  ]);
 }
 if(type==='corners')groups.push([0,4,20,24]);
 if(type==='machete')groups.push(Array.from({length:25},(_,i)=>i));
 if(type==='line'){
  for(let r=0;r<5;r++)
   groups.push(Array.from({length:5},(_,c)=>index(r,c)));
  for(let c=0;c<5;c++)
   groups.push(Array.from({length:5},(_,r)=>index(r,c)));
 }
 return groups;
}

function checkWinner(){
 if(!board)return;
 const called=new Set(drawn);
 const winner=patterns($('pattern').value).some(group=>
  group.every(i=>board[i]===null||called.has(board[i]))
 );
 $('winStatus').textContent=winner?'🎉 ¡BINGO! '+player+' completó la figura.':'';
 if(winner&&!announced)announced=true;
 if(!winner)announced=false;
}

function label(n){
 return 'BINGO'[Math.floor((n-1)/15)]+'-'+n;
}

function updateDraw(){
 const n=drawn.at(-1);
 $('last').textContent=n?label(n):'--';
 $('count').textContent=drawn.length;
 $('history').textContent=drawn.map(label).join(' · ');
 renderBoard();
}

$('getCard').addEventListener('click',()=>{
 const name=$('playerName').value.trim();
 if(!name){alert('Escribe tu nombre.');return;}
 if(board){
  alert('Ya tienes un cartón asignado en esta partida.');
  return;
 }
 player=name;
 board=newBoard();
 $('cardName').textContent=player;
 $('cardWrap').hidden=false;
 renderBoard();
});

$('draw').addEventListener('click',()=>{
 if(!pool.length){
  alert('Ya salieron las 75 bolas.');
  return;
 }
 const i=Math.floor(Math.random()*pool.length);
 const [n]=pool.splice(i,1);
 drawn.push(n);
 updateDraw();
});

$('pattern').addEventListener('change',()=>{
 announced=false;
 checkWinner();
});

$('reset').addEventListener('click',()=>{
 if(!confirm('¿Comenzar una nueva partida? Se borrarán los cartones y las bolas de esta pestaña.'))return;
 board=null;
 player='';
 drawn=[];
 pool=Array.from({length:75},(_,i)=>i+1);
 announced=false;
 $('cardWrap').hidden=true;
 $('card').innerHTML='';
 $('playerName').value='';
 updateDraw();
});

updateDraw();
</script>
</body>
</html>
