<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Bingo Online 75</title><style>
:root{font-family:Arial,sans-serif;color:white;background:#10203e}*{box-sizing:border-box}body{margin:0;padding:20px 10px;text-align:center}h1{color:#ffd600}.panel{max-width:510px;margin:14px auto;padding:18px;background:#20375c;border-radius:15px}input,select,button{padding:12px;margin:4px;border-radius:7px;border:0;font-size:15px;max-width:95%}button{background:#ffd600;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.cell{padding:12px 0;background:white;color:#10203e;border-radius:5px;font-weight:bold}.head{background:#176bcb;color:white}.marked{background:#18b67b;color:white}.muted{color:#cbd7e9;font-size:13px}.ball{font-size:30px;color:#ffd600;font-weight:bold}#hostPanel[hidden],#cardWrap[hidden],#loginBox[hidden]{display:none}#history{overflow-wrap:anywhere;line-height:1.7}button:disabled{opacity:.45;cursor:not-allowed}
</style></head><body><h1>🎱 MI BINGO ONLINE 75</h1><p id="connection">Conectando…</p><section class="panel"><h2>Jugador</h2><input id="name" maxlength="40" placeholder="Tu nombre"><button id="register" disabled>Recibir mi cartón</button><p id="message" aria-live="polite"></p><div id="cardWrap" hidden><h3 id="cardName"></h3><div id="card" class="grid"></div><h3 id="myWin"></h3></div></section><section class="panel"><h2>Partida en vivo</h2><p id="status">Esperando…</p><p>Forma de ganar: <b id="shapeLabel">—</b></p><p class="ball" id="last">--</p><p>Bolas: <span id="count">0</span>/75</p><div id="history"></div><h3 id="winners"></h3></section><section class="panel"><details><summary>🔒 Acceso del anfitrión</summary><div id="loginBox"><input id="email" type="email" placeholder="Correo de anfitrión"><input id="password" type="password" placeholder="Contraseña"><button id="login">Entrar</button></div><div id="hostPanel" hidden><h3>Panel privado</h3><select id="pattern"><option value="small">Cuadro pequeño</option><option value="large">Cuadro grande</option><option value="crossSmall">Cruz pequeña</option><option value="crossLarge">Cruz grande</option><option value="corners">Cuatro esquinas</option><option value="machete">Macheteado (cartón lleno)</option><option value="line">Línea horizontal o vertical</option></select><p><button id="start">Iniciar bingo</button><button id="draw">Sacar bola</button><button id="reset">Nueva partida</button></p><p id="hostInfo"></p><div id="players"></div><button id="logout">Cerrar sesión</button></div></details></section><p class="muted">El anfitrión debe mantener esta página abierta durante la partida.</p>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import{getAuth,onAuthStateChanged,signInAnonymously,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import{getDatabase,ref,onValue,set,update,runTransaction,remove,get}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
const config={apiKey:'AIzaSyDZg6nKMQABedrj52MeOiHwKMrvoSCFgss',authDomain:'mi-bingo-online-75.firebaseapp.com',databaseURL:'https://mi-bingo-online-75-default-rtdb.firebaseio.com',projectId:'mi-bingo-online-75',storageBucket:'mi-bingo-online-75.firebasestorage.app',messagingSenderId:'492946432662',appId:'1:492946432662:web:ea867069f10648525358b7'};
const HOST='0spqf7TObphK29DBAfwnxb7ilH12',db=getDatabase(initializeApp(config)),auth=getAuth();const $=id=>document.getElementById(id);const base='partidas/principal/';let uid='',isHost=false,game={},requests={},players={},mine=null,assigning=false,working=false;const labels={small:'Cuadro pequeño',large:'Cuadro grande',crossSmall:'Cruz pequeña',crossLarge:'Cruz grande',corners:'Cuatro esquinas',machete:'Macheteado',line:'Línea horizontal o vertical'};const idx=(r,c)=>r*5+c;
function makeBoard(){let b=Array(25).fill(null);for(let c=0;c<5;c++){let a=Array.from({length:15},(_,i)=>c*15+i+1);for(let i=14;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}let k=0;for(let r=0;r<5;r++)if(!(r===2&&c===2))b[idx(r,c)]=a[k++]}return b}
function groups(type){let g=[],sq=(r,c,n)=>Array.from({length:n*n},(_,i)=>idx(r+Math.floor(i/n),c+i%n));if(type==='small')for(let r=0;r<4;r++)for(let c=0;c<4;c++)g.push(sq(r,c,2));if(type==='large'||type==='machete')g.push(sq(0,0,5));if(type==='crossSmall')g.push([12,7,17,11,13]);if(type==='crossLarge')g.push([...Array.from({length:5},(_,r)=>idx(r,2)),...Array.from({length:5},(_,c)=>idx(2,c))]);if(type==='corners')g.push([0,4,20,24]);if(type==='line'){for(let r=0;r<5;r++)g.push(Array.from({length:5},(_,c)=>idx(r,c)));for(let c=0;c<5;c++)g.push(Array.from({length:5},(_,r)=>idx(r,c)))}return g}
function wins(b,balls,shape){if(!Array.isArray(b)||b.length!==25)return false;let called=new Set(balls);return groups(shape).some(g=>g.every(i=>b[i]===null||called.has(b[i])))}function ballLabel(n){return'BINGO'[Math.floor((n-1)/15)]+'-'+n}function render(){let balls=Array.isArray(game.bolas)?game.bolas:[];$('status').textContent=({inscripciones:'Inscripciones abiertas',jugando:'Partida en curso',finalizado:'Partida terminada'})[game.estado]||'Esperando al anfitrión';$('shapeLabel').textContent=labels[game.forma]||'—';$('last').textContent=balls.length?ballLabel(balls.at(-1)):'--';$('count').textContent=balls.length;$('history').textContent=balls.map(ballLabel).join(' · ');$('winners').textContent=game.ganadores?.length?'🎉 Ganadores: '+game.ganadores.map(x=>x.nombre).join(', '):'';$('register').disabled=!uid||isHost||game.estado!=='inscripciones'||!!mine||!!requests[uid];$('message').textContent=mine?'Ya tienes un cartón asignado.':requests[uid]?'Solicitud recibida. Espera tu cartón.':game.estado==='inscripciones'?'Escribe tu nombre para recibir un cartón.':'Las inscripciones están cerradas.';$('cardWrap').hidden=!mine;if(mine){$('cardName').textContent=mine.nombre;$('card').replaceChildren();for(let letter of'BINGO'){let d=document.createElement('div');d.className='cell head';d.textContent=letter;$('card').append(d)}for(let n of mine.carton){let d=document.createElement('div');d.className='cell'+(n===null||balls.includes(n)?' marked':'');d.textContent=n===null?'⭐':n;$('card').append(d)}$('myWin').textContent=wins(mine.carton,balls,game.forma)?'🎉 ¡BINGO!':''}if(isHost){$('start').disabled=game.estado!=='inscripciones';$('draw').disabled=game.estado!=='jugando';$('pattern').disabled=game.estado!=='inscripciones';$('pattern').value=game.forma||'small';$('hostInfo').textContent='Inscritos: '+Object.keys(players).length+' · Solicitudes: '+Object.keys(requests).length;$('players').replaceChildren();for(let [id,p]of Object.entries(players)){let d=document.createElement('details'),s=document.createElement('summary');s.textContent=p.nombre;d.append(s);let pre=document.createElement('pre');pre.textContent=p.carton.map((n,i)=>(n===null?'⭐':String(n).padStart(2,' '))+((i+1)%5===0?'\n':'  ')).join('');d.append(pre);$('players').append(d)}}}
async function allocate(){if(!isHost||assigning||game.estado!=='inscripciones')return;assigning=true;try{let max=game.maxJugadores||100;for(let [id,r]of Object.entries(requests)){if(r.ronda!==game.ronda||players[id]||Object.keys(players).length>=max)continue;let carton=makeBoard();await set(ref(db,base+'jugadores/'+id),{nombre:r.nombre,carton,ronda:game.ronda});await remove(ref(db,base+'solicitudes/'+id))}}catch(e){console.error(e);$('hostInfo').textContent='Error al asignar cartón: '+e.message}finally{assigning=false}}
onAuthStateChanged(auth,async user=>{uid=user?.uid||'';isHost=uid===HOST;$('hostPanel').hidden=!isHost;$('loginBox').hidden=isHost;$('connection').textContent=uid?(isHost?'Anfitrión conectado':'Jugador conectado'):'Conectando…';render();if(!user){try{await signInAnonymously(auth)}catch(e){$('connection').textContent='Error de acceso: '+e.message}}});
onValue(ref(db,base+'estado'),s=>{game.estado=s.val();render();allocate()});onValue(ref(db,base+'forma'),s=>{game.forma=s.val();render()});onValue(ref(db,base+'bolas'),s=>{game.bolas=s.val()||[];render()});onValue(ref(db,base+'ganadores'),s=>{game.ganadores=s.val()||[];render()});onValue(ref(db,base+'ronda'),s=>{game.ronda=s.val();mine=null;render()});onValue(ref(db,base+'maxJugadores'),s=>{game.maxJugadores=s.val()||100;render()});let stopMine=()=>{},stopReq=()=>{},stopHostReq=()=>{},stopHostPlayers=()=>{};onAuthStateChanged(auth,user=>{stopMine();stopReq();stopHostReq();stopHostPlayers();requests={};players={};mine=null;if(!user)return;stopMine=onValue(ref(db,base+'jugadores/'+user.uid),s=>{mine=s.val();render()});stopReq=onValue(ref(db,base+'solicitudes/'+user.uid),s=>{if(!isHost){requests={[user.uid]:s.val()};render()}});if(user.uid===HOST){stopHostReq=onValue(ref(db,base+'solicitudes'),s=>{requests=s.val()||{};render();allocate()});stopHostPlayers=onValue(ref(db,base+'jugadores'),s=>{players=s.val()||{};render();allocate()})}});
$('register').onclick=async()=>{let nombre=$('name').value.trim();if(!nombre)return alert('Escribe tu nombre.');try{await set(ref(db,base+'solicitudes/'+uid),{nombre,ronda:game.ronda});$('name').disabled=true}catch(e){alert('No se pudo registrar: '+e.message)}};
$('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('password').value=''}catch(e){alert('No se pudo iniciar sesión: '+e.message)}};$('logout').onclick=async()=>{await signOut(auth);await signInAnonymously(auth)};
$('pattern').onchange=async()=>{if(isHost&&game.estado==='inscripciones')await set(ref(db,base+'forma'),$('pattern').value)};
$('start').onclick=async()=>{if(!isHost)return;await allocate();if(!Object.keys(players).length)return alert('Todavía no hay cartones asignados.');await set(ref(db,base+'estado'),'jugando')};
$('draw').onclick=async()=>{if(!isHost||working||game.estado!=='jugando')return;working=true;try{let current=Array.isArray(game.bolas)?game.bolas:[];if(current.length>=75)return alert('Salieron las 75 bolas.');let available=Array.from({length:75},(_,i)=>i+1).filter(n=>!current.includes(n));let n=available[Math.floor(Math.random()*available.length)];let updated=[...current,n];let winnerList=Object.values(players).filter(p=>p.ronda===game.ronda&&wins(p.carton,updated,game.forma)).map(p=>({nombre:p.nombre}));await set(ref(db,base+'bolas'),updated);if(winnerList.length){await set(ref(db,base+'ganadores'),winnerList);await set(ref(db,base+'estado'),'finalizado')}}catch(e){alert(e.message)}finally{working=false}};
$('reset').onclick=async()=>{if(!isHost||!confirm('¿Nueva partida? Se borrarán los cartones y las bolas anteriores.'))return;try{await set(ref(db,base),{estado:'inscripciones',forma:$('pattern').value,bolas:[],ganadores:[],jugadores:{},solicitudes:{},maxJugadores:100,ronda:Date.now()});$('name').disabled=false}catch(e){alert('Error: '+e.message)}};
</script></body></html>
